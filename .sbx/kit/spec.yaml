schemaVersion: "2"
kind: mixin
name: canton-base-images-tools
displayName: Canton base images build tools
description: Toolchain for building and scanning the canton-base-images rootfs and container images.
requires:
  agent: claude

permissions:
  network:
    allow:
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - ftp.gnu.org
      - gnu.mirror.constant.com
      - busybox.net
      - curl.se
      - nodejs.org
      - adoptium.net
      - data.iana.org
      - github.com
      - api.github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      - get.anchore.io
      - ghcr.io
      - registry-1.docker.io
      - auth.docker.io
      - gcc.gnu.org
      - production.cloudflare.docker.com

setup:
  install:
    - description: Build dependencies (mirrors the CI workflow)
      user: "0"
      command: >-
        apt-get update &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        build-essential wget curl git gpg lzip xz-utils ca-certificates
        gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
        gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        gcc-13 g++-13
        gcc-13-x86-64-linux-gnu g++-13-x86-64-linux-gnu
        gcc-13-aarch64-linux-gnu g++-13-aarch64-linux-gnu
        bison gawk texinfo pkg-config file rsync unzip tar jq
        qemu-user proot direnv &&
        for a in aarch64 x86_64; do ln -sf "/usr/bin/qemu-$a" "/usr/local/bin/qemu-$a-static"; done &&
        rm -rf /var/lib/apt/lists/*
    - description: syft (SBOM generation)
      user: "0"
      command: >-
        command -v syft >/dev/null ||
        curl -sSfL https://get.anchore.io/syft | sh -s -- -b /usr/local/bin
    - description: grype (vulnerability scanning)
      user: "0"
      command: >-
        command -v grype >/dev/null ||
        curl -sSfL https://get.anchore.io/grype | sh -s -- -b /usr/local/bin

  startup:
    - description: Import the pinned upstream signing keys (keys/trusted-keys.asc)
      command:
        - sh
        - -c
        - 'f="$WORKSPACE_DIR/keys/trusted-keys.asc"; [ -f "$f" ] && gpg --batch --import "$f" >/dev/null 2>&1 || true'
