name: Publish and Release images

on:
  release:
    types: [published]
jobs:
  trigger-build:
    runs-on: canton-network-canton-base-images
    steps:
      - name: "DEBUG: Log event context"
        env:
          EVENT_CONTEXT: ${{ toJSON(github.event) }}
        run: |
          printf '%s\n' "$EVENT_CONTEXT"
      - name: Trigger build in dach-ny/da-base-images
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const payload = {
              sha: context.sha,
              ref: context.ref,
              repo: context.payload.repository.full_name,
              event_name: context.eventName,
              release: context.payload.release
            };
            console.log("Sending payload:", payload);
            console.log("Send Context:", context);
            await github.rest.repos.createDispatchEvent({
              owner: 'dach-ny',
              repo: 'da-base-images',
              event_type: 'release-images',
              client_payload: payload
            });
